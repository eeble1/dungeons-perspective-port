plugins {
    id 'com.gradleup.shadow'
    id 'com.modrinth.minotaur' version '2.+'
}

def platform = project.name

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    // YACL - fabric
    modImplementation "dev.isxander:yet-another-config-lib:${rootProject.yacl_version}-${platform}"

    // Cloth Config
    modImplementation "me.shedaniel.cloth:cloth-config-${platform}:${rootProject.cloth_config_version}"

    // owo-lib
    modImplementation "io.wispforest:owo-lib:${rootProject.owo_version}"
    annotationProcessor "io.wispforest:owo-lib:${rootProject.owo_version}"

    // Combat Roll
    modCompileOnly "maven.modrinth:combat-roll:${rootProject.combat_roll_version}-${platform}"

    // ModMenu
    modImplementation "maven.modrinth:modmenu:${rootProject.modmenu_version}"

    // Sodium compatibility is retained but disabled while testing the vanilla/Indigo culling
    // path. Compile against it without automatically adding it to development runs.
    modCompileOnly "maven.modrinth:sodium:${rootProject.sodium_version}-${platform}"

    implementation include("maven.modrinth:tiny-config:${project.tiny_config_version}-fabric")

    // TinyConfig (bundled)
}

processResources {
    inputs.property 'version', project.version

    filesMatching("fabric.mod.json") {
        expand(project.properties)
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
